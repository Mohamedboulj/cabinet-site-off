<!doctype html>
<html lang="fr-MA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre de secours (dev). Au build, titre, description, Open Graph,
         canonical et données structurées sont générés depuis src/data/site.js
         par scripts/prerender.js et injectés à la place de app-head. -->
    <title>Cabinet Jouba – Dr Mahjouba Boudkour</title>
    <!--app-head-->
    <meta name="theme-color" content="#0891B2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
    />

    <!-- Sans JavaScript, les animations d'apparition ne se déclenchent pas :
         on force alors l'affichage du contenu. -->
    <noscript>
      <style>
        [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
